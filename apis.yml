aid: mint-house
name: Mint House
description: 'Mint House is a US residential-hospitality operator founded in 2017 by
  Will Lucas that runs tech-enabled apartment-hotel units — full kitchens, workspaces
  and app-based check-in — in downtown districts of markets including New York, Miami,
  Nashville, Dallas, Washington DC, Houston, Phoenix and Madison. It raised a $35M
  Series B in May 2022 led by Mohari Hospitality with Revolution Ventures, Allegion
  Ventures and Ingleside Investors. In January 2026 Mint House entered an all-equity
  strategic combination with Kasa; the portfolio now operates as "Mint House by Kasa"
  and every corporate page on minthouse.com redirects to kasa.com. Mint House is a
  hospitality operator, not a software vendor: it publishes a consumer booking site
  and no public API, SDK, webhook or developer program of any kind.'
